[package]
name = "dup-remover"
version = "0.1.0"
edition = "2024"
description = "A Rust command-line tool for finding duplicate files"

[dependencies]
blake3 = "1.8"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
